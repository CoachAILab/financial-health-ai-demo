<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#042C53;
    --blue:#185FA5;
    --mid:#378ADD;
    --light:#B5D4F4;
    --pale:#E6F1FB;
    --white:#fff;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh}

  /* ── HEADER ── */
  .header{background:var(--navy);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .header-title{color:#fff;font-size:15px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  .header-sub{color:var(--light);font-size:11px;margin-top:2px}

  /* ── SWITCHER ── */
  .switcher{display:flex;gap:6px;flex-wrap:wrap}
  .btn{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,0.2)}
  .btn.active{background:#fff;color:var(--navy);border-color:#fff}
  .btn-compare{background:rgba(55,138,221,0.3);border-color:var(--mid);font-size:11px;padding:7px 12px}
  .btn-compare.active{background:var(--mid);color:#fff;border-color:var(--mid)}

  /* ── STAGE ── */
  .stage{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:36px 24px;min-height:calc(100vh - 80px);flex-wrap:wrap}

  /* ── PHONE FRAME ── */
  .phone-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .phone-label{
    font-size:15px;font-weight:600;color:var(--navy);
    letter-spacing:.2px;
  }
  .phone{
    width:375px;height:780px;
    border-radius:40px;
    background:#fff;
    /* Thin elegant frame */
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.07),
      0 0 0 7px #dde3ea,
      0 0 0 8px rgba(0,0,0,0.05),
      0 24px 60px rgba(0,0,0,0.16);
    /* Critical: clip rounded corners AND prevent overflow */
    overflow:hidden;
    position:relative;
    flex-shrink:0;
    /* Force GPU compositing so overflow:hidden clips correctly */
    transform:translateZ(0);
    isolation:isolate;
  }
  .phone iframe{
    width:calc(100% - 10px);
    height:100%;
    border:none;
    display:block;
    overflow:hidden;
    border-radius:40px;
    margin: 0 auto;
  }

  /* ── COMPARE MODE ── */
  .phone-wrap.hidden{display:none}
  .phone-wrap.side{display:flex}

  /* ── COMPARE SELECTOR ── */
  .compare-bar{display:none;background:#fff;border-bottom:1px solid var(--light);padding:10px 24px;gap:8px;align-items:center;flex-wrap:wrap}
  .compare-bar.visible{display:flex}
  .compare-bar-label{font-size:12px;color:var(--blue);font-weight:500;margin-right:4px}
  .chk-btn{display:flex;align-items:center;gap:6px;background:var(--pale);border:1px solid var(--light);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--navy);cursor:pointer;transition:all .15s;user-select:none}
  .chk-btn.checked{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chk-btn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}
</style>
</head>

function switchPeriod(clientIdx, tabEl, panelId){

}

<script>
  var compareMode = false;
  var selected = [true, true, false];
  var soloActive = 0;

  function solo(i) {
    if (compareMode) return;
    soloActive = i;
    [0,1,2].forEach(function(j) {
      document.getElementById('wrap'+j).className = 'phone-wrap' + (j===i ? '' : ' hidden');
      document.getElementById('btn'+j).className = 'btn' + (j===i ? ' active' : '');
    });
  }

  function toggleCompare() {
    compareMode = !compareMode;
    var btn = document.getElementById('btnCompare');
    var bar = document.getElementById('compareBar');
    btn.className = 'btn btn-compare' + (compareMode ? ' active' : '');
    bar.className = 'compare-bar' + (compareMode ? ' visible' : '');
    if (compareMode) {
      applyCompare();
      [0,1,2].forEach(function(j) { document.getElementById('btn'+j).className = 'btn'; });
    } else {
      solo(soloActive);
    }
  }

  function toggleChk(i) {
    var active = selected.filter(Boolean).length;
    if (selected[i] && active <= 1) return;
    if (!selected[i] && active >= 2) {
      var other = selected.findIndex(function(v,j){ return v && j!==i; });
      selected[other] = false;
      document.getElementById('chk'+other).className = 'chk-btn';
    }
    selected[i] = !selected[i];
    document.getElementById('chk'+i).className = 'chk-btn' + (selected[i] ? ' checked' : '');
    applyCompare();
  }

  function applyCompare() {
    [0,1,2].forEach(function(j) {
      document.getElementById('wrap'+j).className = 'phone-wrap' + (selected[j] ? ' side' : ' hidden');
    });
  }
</script>
